# Панель и API на одном origin: /api, /media, /ws проксируются в контейнер api.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 60m;  # до 5 фото по 10 МБ
    proxy_connect_timeout 5s;  # API недоступен — быстро отдаём 502, а не висим минуту

    location /api/   { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /media/ { proxy_pass http://api:8000; }
    location /docs   { proxy_pass http://api:8000; }
    location /openapi.json { proxy_pass http://api:8000; }
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
    # SPA: все остальные пути — index.html
    location / { try_files $uri /index.html; }
}
